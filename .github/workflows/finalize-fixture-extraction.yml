name: Finalize fixture extraction

on:
  push:
    paths:
      - .github/workflows/finalize-fixture-extraction.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
      REDIS_URL: redis://localhost:6379
      PAIRING_PEPPER: ci-pairing-pepper-00000000000000000000000000000000
      DEVICE_TOKEN_PEPPER: ci-device-pepper-000000000000000000000000000000000
      AUTH_MODE: dev
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extract-fixtures
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --lockfile-only --reporter=append-only
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - run: pnpm db:migrate
      - run: pnpm check
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-fixture-extraction.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract fixtures into dedicated repository'
          git push origin HEAD:agent/extract-fixtures
