name: Apply remaining type and lint fixes

on:
  push:
    paths:
      - .github/workflows/fix-remaining-types.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Apply exact compatibility fixes
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/fix-remaining.py
          python /tmp/fix-remaining.py
          pnpm exec biome check --write apps/api/src/app.ts apps/connector/src/runtime-client.ts apps/connector/src/index.ts apps/worker/src/index.ts apps/web/app/globals.css
          pnpm --filter @symphoneer-hub/api check:types
          pnpm --filter @symphoneer-hub/connector check:types
          pnpm --filter @symphoneer-hub/worker check:types
          pnpm --filter @symphoneer-hub/web build
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/app.ts apps/connector/src/runtime-client.ts apps/connector/src/index.ts apps/worker/src/index.ts apps/web/app/globals.css
          git commit -m 'fix remaining type and lint issues'
          git push origin HEAD:main
