name: Remove migrated fixture assets

on:
  push:
    paths:
      - .github/workflows/move-fixtures.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
      REDIS_URL: redis://localhost:6379
      PAIRING_PEPPER: ci-pairing-pepper-00000000000000000000000000000000
      DEVICE_TOKEN_PEPPER: ci-device-pepper-000000000000000000000000000000000
      AUTH_MODE: dev
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Remove Hub fixture coupling
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/remove-fixtures.py
          python /tmp/remove-fixtures.py
          pnpm install --lockfile-only --reporter=append-only
          pnpm install --frozen-lockfile --reporter=append-only
          pnpm exec biome check --write .
          pnpm db:migrate
          pnpm check
          if git grep -n -i fixture -- ':!.github/workflows/move-fixtures.yml'; then
            echo 'Fixture coupling remains in Hub' >&2
            exit 1
          fi
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor move fixtures to dedicated repository'
          git push origin HEAD:main
