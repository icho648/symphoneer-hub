name: Apply complete API TypeScript fixes

on:
  push:
    paths:
      - .github/workflows/fix-api-types-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Apply complete API type fixes
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/fix-api.py
          python /tmp/fix-api.py
          pnpm exec biome check --write apps/api/src/app.ts apps/api/src/errors.ts apps/api/src/server.ts apps/api/src/websocket-gateway.ts
          pnpm --filter @symphoneer-hub/api check:types
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/app.ts apps/api/src/errors.ts apps/api/src/server.ts apps/api/src/websocket-gateway.ts
          git commit -m 'fix complete API TypeScript compatibility'
          git push origin HEAD:main
