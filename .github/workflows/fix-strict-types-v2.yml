name: Apply strict TypeScript fixes v2

on:
  push:
    paths:
      - .github/workflows/fix-strict-types-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Apply formatting-independent fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              assert old in text, f"missing {label}"
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              assert count == 1, f"missing {label}"
              return updated

          app = Path("apps/api/src/app.ts")
          text = app.read_text()
          text = replace_once(
              text,
              'import express, { type Request } from "express";',
              'import express, { type Express, type Request } from "express";',
              "Express type import",
          )
          text = replace_once(text, 'import type pino from "pino";', 'import type { Logger } from "pino";', "Logger import")
          text = replace_once(text, 'import pinoHttp from "pino-http";', 'import { pinoHttp } from "pino-http";', "pino-http import")
          text = replace_once(text, '  logger: pino.Logger;', '  logger: Logger;', "logger type")
          text = sub_once(
              text,
              r'function installationId\(request: Request\): string \{.*?\n\}',
              '''function routeParam(
            request: Request,
            name: string,
            code: string,
            message: string,
          ): string {
            const value = request.params[name];
            if (typeof value !== "string" || value.length === 0) {
              throw new ApiError(400, code, message);
            }
            return value;
          }

          function installationId(request: Request): string {
            return routeParam(
              request,
              "installationId",
              "invalid_installation",
              "installation ID is required",
            );
          }''',
              "route parameter helper",
          )
          text = replace_once(
              text,
              'export function createApiApp(dependencies: ApiDependencies) {',
              'export function createApiApp(dependencies: ApiDependencies): Express {',
              "API app return type",
          )
          text = text.replace('    } catch (error) {\n      next(new ApiError(503, "not_ready", "database or relay is unavailable"));', '    } catch {\n      next(new ApiError(503, "not_ready", "database or relay is unavailable"));', 1)
          text = sub_once(
              text,
              r'\s+const commandId = request\.params\.commandId;\n\s+if \(!commandId\) throw new ApiError\(400, "invalid_command", "command ID is required"\);',
              '''
              const commandId = routeParam(
                request,
                "commandId",
                "invalid_command",
                "command ID is required",
              );''',
              "command route parameter",
          )
          app.write_text(text)

          errors = Path("apps/api/src/errors.ts")
          text = errors.read_text()
          text = sub_once(
              text,
              r'export class ApiError extends Error \{\n\s+constructor\(\s+readonly status: number,\s+readonly code: string,\s+message: string,\s+\) \{\s+super\(message\);\s+this\.name = "ApiError";\s+\}\n\}',
              '''export class ApiError extends Error {
            readonly status: number;
            readonly code: string;

            constructor(status: number, code: string, message: string) {
              super(message);
              this.status = status;
              this.code = code;
              this.name = "ApiError";
            }
          }''',
              "ApiError fields",
          )
          errors.write_text(text)

          for path in ("apps/api/src/server.ts", "apps/worker/src/index.ts"):
              file = Path(path)
              file.write_text(replace_once(file.read_text(), 'import pino from "pino";', 'import { pino } from "pino";', f"pino import in {path}"))

          gateway = Path("apps/api/src/websocket-gateway.ts")
          text = gateway.read_text()
          text = replace_once(text, 'import type pino from "pino";', 'import type { Logger } from "pino";', "gateway Logger import")
          text = replace_once(text, '  logger: pino.Logger;', '  logger: Logger;', "gateway logger type")
          text = sub_once(
              text,
              r'  private readonly connections = new Map<string, Connection>\(\);\n\s+constructor\(private readonly dependencies: GatewayDependencies\) \{\}',
              '''  private readonly connections = new Map<string, Connection>();
            private readonly dependencies: GatewayDependencies;

            constructor(dependencies: GatewayDependencies) {
              this.dependencies = dependencies;
            }''',
              "ConnectorGateway fields",
          )
          gateway.write_text(text)

          runtime = Path("apps/connector/src/runtime-client.ts")
          text = runtime.read_text()
          text = sub_once(
              text,
              r'export class RuntimeClientError extends Error \{\n\s+constructor\(\s+readonly status: number,\s+readonly code: string,\s+message: string,\s+\) \{\s+super\(message\);\s+this\.name = "RuntimeClientError";\s+\}\n\}',
              '''export class RuntimeClientError extends Error {
            readonly status: number;
            readonly code: string;

            constructor(status: number, code: string, message: string) {
              super(message);
              this.status = status;
              this.code = code;
              this.name = "RuntimeClientError";
            }
          }''',
              "RuntimeClientError fields",
          )
          text = sub_once(
              text,
              r'export class RuntimeClient \{\n\s+private readonly baseUrl: string;\n\s+constructor\(\s+baseUrl: string,\s+private readonly request: typeof fetch = fetch,\s+\) \{',
              '''export class RuntimeClient {
            private readonly baseUrl: string;
            private readonly request: typeof fetch;

            constructor(baseUrl: string, request: typeof fetch = fetch) {''',
              "RuntimeClient request field",
          )
          text = replace_once(
              text,
              '    this.baseUrl = url.href.replace(/\\/$/, "");\n  }',
              '    this.baseUrl = url.href.replace(/\\/$/, "");\n    this.request = request;\n  }',
              "RuntimeClient request assignment",
          )
          runtime.write_text(text)

          connector = Path("apps/connector/src/index.ts")
          text = connector.read_text()
          text = sub_once(
              text,
              r'console\.log\(JSON\.stringify\(\{ time: new Date\(\)\.toISOString\(\), message, \.\.\.redact\(data\) \}\)\);',
              'console.log(JSON.stringify({ time: new Date().toISOString(), message, data: redact(data) }));',
              "safe connector log",
          )
          connector.write_text(text)

          relay = Path("packages/relay/src/index.ts")
          text = relay.read_text().replace(
              'this.redis.on("pmessage", (_pattern, channel, payload) => {',
              'this.redis.on("pmessage", (_pattern: string, channel: string, payload: string) => {',
          )
          relay.write_text(text)

          css = Path("apps/web/app/globals.css")
          css.write_text(css.read_text().replace(" !important", ""))
          PY
          pnpm exec biome check --write \
            apps/api/src/app.ts \
            apps/api/src/errors.ts \
            apps/api/src/server.ts \
            apps/api/src/websocket-gateway.ts \
            apps/worker/src/index.ts \
            apps/connector/src/index.ts \
            apps/connector/src/runtime-client.ts \
            packages/relay/src/index.ts \
            apps/web/app/globals.css
      - name: Commit fixes and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-types.yml
          rm -f .github/workflows/fix-strict-types.yml
          rm -f .github/workflows/fix-strict-types-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix strict TypeScript compatibility'
          git push origin HEAD:main
