name: Publish verified source tree

on:
  push:
    paths:
      - .github/workflows/bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and verify archive
        shell: bash
        run: |
          set -euo pipefail

          # One 1,000-character GitHub contents payload lost a 12-character run.
          # Reinsert the exact run at the verified offset before concatenation.
          python - <<'PY'
          from pathlib import Path
          damaged = Path('.bootstrap/f10b1.0').read_text()
          assert len(damaged) == 988
          repaired = damaged[:308] + 'cy93ZWIvYXBw' + damaged[308:]
          assert len(repaired) == 1000
          Path('/tmp/f10b.1').write_text(repaired)
          PY

          cat \
            .bootstrap/chunk.00 \
            .bootstrap/chunk.01 \
            .bootstrap/chunk.02 \
            .bootstrap/chunk.03 \
            .bootstrap/fixed.04a \
            .bootstrap/fixed.04b \
            .bootstrap/chunk.05 \
            .bootstrap/chunk.06 \
            .bootstrap/chunk.07 \
            .bootstrap/chunk.08 \
            .bootstrap/chunk.09 \
            .bootstrap/fixed.100 \
            .bootstrap/f10b.0 \
            /tmp/f10b.1 \
            .bootstrap/f10b.2 \
            .bootstrap/f10b.3 \
            .bootstrap/chunk.11 \
            > /tmp/symphoneer-hub.zip.b64

          printf '%s  %s\n' '07e2e14b429f2b9f79c9c3c702c4362c74aa81f3ffa0374f079054f300238d4e' '/tmp/symphoneer-hub.zip.b64' | sha256sum --check --strict
          base64 --decode /tmp/symphoneer-hub.zip.b64 > /tmp/symphoneer-hub.zip
          printf '%s  %s\n' 'bfb188bee4fac4cb991ca88eb27b6e6a05c1717d73ef4f1125bb601c9c5d980b' '/tmp/symphoneer-hub.zip' | sha256sum --check --strict
          unzip -t /tmp/symphoneer-hub.zip
          mkdir -p /tmp/symphoneer-hub-unpacked
          unzip -q /tmp/symphoneer-hub.zip -d /tmp/symphoneer-hub-unpacked
      - name: Replace bootstrap tree with source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          cp -a /tmp/symphoneer-hub-unpacked/symphoneer-hub/. .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build Symphoneer Hub MVP'
          git push origin HEAD:main
