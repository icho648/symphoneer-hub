name: Apply strict TypeScript fixes

on:
  push:
    paths:
      - .github/workflows/fix-strict-types.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Apply exact source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              assert old in text, f"missing expected text in {path}: {old[:80]!r}"
              file.write_text(text.replace(old, new))

          app = Path("apps/api/src/app.ts")
          text = app.read_text()
          text = text.replace(
              'import express, { type Request } from "express";',
              'import express, { type Express, type Request } from "express";',
          )
          text = text.replace('import type pino from "pino";', 'import type { Logger } from "pino";')
          text = text.replace('import pinoHttp from "pino-http";', 'import { pinoHttp } from "pino-http";')
          text = text.replace('  logger: pino.Logger;', '  logger: Logger;')
          old = '''function installationId(request: Request): string {
            const value = request.params.installationId;
            if (!value) throw new ApiError(400, "invalid_installation", "installation ID is required");
            return value;
          }'''
          new = '''function routeParam(
            request: Request,
            name: string,
            code: string,
            message: string,
          ): string {
            const value = request.params[name];
            if (typeof value !== "string" || value.length === 0) {
              throw new ApiError(400, code, message);
            }
            return value;
          }

          function installationId(request: Request): string {
            return routeParam(
              request,
              "installationId",
              "invalid_installation",
              "installation ID is required",
            );
          }'''
          assert old in text, "missing installationId helper"
          text = text.replace(old, new)
          text = text.replace(
              'export function createApiApp(dependencies: ApiDependencies) {',
              'export function createApiApp(dependencies: ApiDependencies): Express {',
          )
          text = text.replace('    } catch (error) {\n      next(new ApiError(503, "not_ready", "database or relay is unavailable"));', '    } catch {\n      next(new ApiError(503, "not_ready", "database or relay is unavailable"));')
          old = '''      const commandId = request.params.commandId;
                if (!commandId) throw new ApiError(400, "invalid_command", "command ID is required");'''
          new = '''      const commandId = routeParam(
                request,
                "commandId",
                "invalid_command",
                "command ID is required",
              );'''
          assert old in text, "missing command route parameter"
          app.write_text(text.replace(old, new))

          replace(
              "apps/api/src/errors.ts",
              '''export class ApiError extends Error {
            constructor(
              readonly status: number,
              readonly code: string,
              message: string,
            ) {
              super(message);
              this.name = "ApiError";
            }
          }''',
              '''export class ApiError extends Error {
            readonly status: number;
            readonly code: string;

            constructor(status: number, code: string, message: string) {
              super(message);
              this.status = status;
              this.code = code;
              this.name = "ApiError";
            }
          }''',
          )

          for path in ("apps/api/src/server.ts", "apps/worker/src/index.ts"):
              replace(path, 'import pino from "pino";', 'import { pino } from "pino";')

          gateway = Path("apps/api/src/websocket-gateway.ts")
          text = gateway.read_text()
          text = text.replace('import type pino from "pino";', 'import type { Logger } from "pino";')
          text = text.replace('  logger: pino.Logger;', '  logger: Logger;')
          old = '''  private readonly connections = new Map<string, Connection>();

            constructor(private readonly dependencies: GatewayDependencies) {}'''
          new = '''  private readonly connections = new Map<string, Connection>();
            private readonly dependencies: GatewayDependencies;

            constructor(dependencies: GatewayDependencies) {
              this.dependencies = dependencies;
            }'''
          assert old in text, "missing ConnectorGateway parameter property"
          gateway.write_text(text.replace(old, new))

          runtime = Path("apps/connector/src/runtime-client.ts")
          text = runtime.read_text()
          old = '''export class RuntimeClientError extends Error {
            constructor(
              readonly status: number,
              readonly code: string,
              message: string,
            ) {
              super(message);
              this.name = "RuntimeClientError";
            }
          }'''
          new = '''export class RuntimeClientError extends Error {
            readonly status: number;
            readonly code: string;

            constructor(status: number, code: string, message: string) {
              super(message);
              this.status = status;
              this.code = code;
              this.name = "RuntimeClientError";
            }
          }'''
          assert old in text, "missing RuntimeClientError parameter properties"
          text = text.replace(old, new)
          old = '''export class RuntimeClient {
            private readonly baseUrl: string;

            constructor(baseUrl: string, private readonly request: typeof fetch = fetch) {'''
          new = '''export class RuntimeClient {
            private readonly baseUrl: string;
            private readonly request: typeof fetch;

            constructor(baseUrl: string, request: typeof fetch = fetch) {'''
          assert old in text, "missing RuntimeClient request parameter property"
          text = text.replace(old, new)
          old = '    this.baseUrl = url.href.replace(/\\/$/, "");\n  }'
          new = '    this.baseUrl = url.href.replace(/\\/$/, "");\n    this.request = request;\n  }'
          assert old in text, "missing RuntimeClient baseUrl assignment"
          runtime.write_text(text.replace(old, new))

          replace(
              "apps/connector/src/index.ts",
              '  console.log(JSON.stringify({ time: new Date().toISOString(), message, ...redact(data) }));',
              '  console.log(JSON.stringify({ time: new Date().toISOString(), message, data: redact(data) }));',
          )

          relay = Path("packages/relay/src/index.ts")
          text = relay.read_text()
          old = 'this.redis.on("pmessage", (_pattern, channel, payload) => {'
          if old in text:
              text = text.replace(
                  old,
                  'this.redis.on("pmessage", (_pattern: string, channel: string, payload: string) => {',
              )
          relay.write_text(text)

          css = Path("apps/web/app/globals.css")
          css.write_text(css.read_text().replace(" !important", ""))
          PY
          pnpm exec biome check --write \
            apps/api/src/app.ts \
            apps/api/src/errors.ts \
            apps/api/src/server.ts \
            apps/api/src/websocket-gateway.ts \
            apps/worker/src/index.ts \
            apps/connector/src/index.ts \
            apps/connector/src/runtime-client.ts \
            packages/relay/src/index.ts \
            apps/web/app/globals.css
      - name: Commit fixes and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-types.yml
          rm -f .github/workflows/fix-strict-types.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix strict TypeScript compatibility'
          git push origin HEAD:main
