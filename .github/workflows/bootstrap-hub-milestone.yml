name: Bootstrap Hub MVP milestone

on:
  push:
    paths:
      - .github/workflows/bootstrap-hub-milestone.yml

permissions:
  issues: write

jobs:
  create-milestone:
    runs-on: ubuntu-latest
    steps:
      - name: Create milestone when absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          title='Hub MVP — Remote Attention & Human Control'
          description='Deliver a production-credible remote attention center for local Symphoneer Runtimes: secure pairing, safe projections, fleet/attention UI, audited human-control commands, notifications, deployment and live integration evidence. Local Runtime remains authoritative and Hub never executes user code.'
          api="https://api.github.com/repos/${REPOSITORY}/milestones"
          existing="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}?state=all&per_page=100" \
            | jq -r --arg title "${title}" '.[] | select(.title == $title) | .number' \
            | head -n 1)"

          if [ -n "${existing}" ]; then
            echo "Milestone already exists: #${existing}"
            exit 0
          fi

          payload="$(jq -n \
            --arg title "${title}" \
            --arg description "${description}" \
            '{title: $title, description: $description, state: "open"}')"

          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}" \
            -d "${payload}" \
            | jq '{number, title, state, html_url}'
