name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54322/postgres
      REDIS_URL: redis://localhost:6379
      PAIRING_PEPPER: ci-pairing-pepper-00000000000000000000000000000000
      DEVICE_TOKEN_PEPPER: ci-device-pepper-000000000000000000000000000000000
      AUTH_MODE: dev
      NEXT_PUBLIC_AUTH_MODE: dev
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - run: pnpm db:migrate
      - name: Run full checks
        shell: bash
        run: |
          set +e
          pnpm check 2>&1 | tee /tmp/pnpm-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            encoded=$(tail -c 12000 /tmp/pnpm-check.log | base64 -w0)
            printf '::error title=pnpm-check-log::%s\n' "$encoded"
            exit "$status"
          fi
