name: Apply TypeScript compatibility fixes

on:
  push:
    paths:
      - .github/workflows/fix-types.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Apply exact source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          relay = Path('packages/relay/src/index.ts')
          text = relay.read_text()
          text = text.replace('import Redis from "ioredis";', 'import { Redis } from "ioredis";')
          for class_name in ('PresenceStore', 'CommandPublisher', 'CommandSubscriber', 'FixedWindowRateLimiter'):
              old = f'export class {class_name} {{\n  constructor(private readonly redis: Redis) {{}}'
              new = f'''export class {class_name} {{\n  private readonly redis: Redis;\n\n  constructor(redis: Redis) {{\n    this.redis = redis;\n  }}'''
              assert old in text, f'missing expected constructor in {class_name}'
              text = text.replace(old, new)
          relay.write_text(text)

          repository = Path('packages/database/src/repository.ts')
          text = repository.read_text()
          old = 'export class HubRepository {\n  constructor(private readonly db: Database) {}'
          new = '''export class HubRepository {\n  private readonly db: Database;\n\n  constructor(db: Database) {\n    this.db = db;\n  }'''
          assert old in text, 'missing HubRepository parameter property'
          text = text.replace(old, new)
          old = '''export class RepositoryError extends Error {\n  constructor(\n    readonly code: string,\n    message: string,\n  ) {\n    super(message);'''
          new = '''export class RepositoryError extends Error {\n  readonly code: string;\n\n  constructor(code: string, message: string) {\n    super(message);\n    this.code = code;'''
          assert old in text, 'missing RepositoryError parameter property'
          text = text.replace(old, new)
          repository.write_text(text)
          PY
          pnpm exec biome check --write packages/relay/src/index.ts packages/database/src/repository.ts
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/relay/src/index.ts packages/database/src/repository.ts
          git commit -m 'fix TypeScript erasable syntax and Redis types'
          git push origin HEAD:main
