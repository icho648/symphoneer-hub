name: Format strict type branch

on:
  push:
    paths:
      - .github/workflows/format-strict-branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-strict-typecheck-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --reporter=append-only
      - name: Apply repository formatting
        run: |
          sed -i 's/ !important//g' apps/web/app/globals.css
          pnpm exec biome check --write .
      - name: Commit formatting
        run: |
          rm -f .github/workflows/format-strict-branch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Format strict TypeScript fixes'
          git push origin HEAD:agent/fix-strict-typecheck-v2
