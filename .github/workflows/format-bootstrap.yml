name: Format and lock repository

on:
  push:
    paths:
      - .github/workflows/format-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: corepack enable
      - run: pnpm install
      - run: pnpm exec biome check --write .
      - name: Commit formatted source and lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format repository and lock dependencies'
          git push origin HEAD:main
